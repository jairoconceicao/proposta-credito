name: proposta-credito
services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    ports:
      - "127.0.0.1:${ORACLE_PORT:-15210}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Execute scripts/bootstrap.ps1}
      APP_USER: PC_OWNER
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Execute scripts/bootstrap.ps1}
      PC_RUNTIME_PASSWORD: ${PC_RUNTIME_PASSWORD:?Execute scripts/bootstrap.ps1}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle/10-runtime-user.sh:/container-entrypoint-initdb.d/10-runtime-user.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    shm_size: 1gb
  rabbitmq:
    image: rabbitmq:4.2.9-management@sha256:d1fb8b38bd0805935907a22b2b7483fba38c9a8dd7e8a74bfba4a6e7a9e91707
    hostname: proposta-rabbit
    ports:
      - "127.0.0.1:${RABBIT_PORT:-56720}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: pc_worker
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Execute scripts/bootstrap.ps1}
      RABBITMQ_DEFAULT_VHOST: proposta-credito
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  oracle-data:
  rabbit-data:
